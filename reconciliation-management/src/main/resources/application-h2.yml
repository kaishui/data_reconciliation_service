# H2 in-memory profile for local development and regression testing
# Usage: --spring.profiles.active=h2
spring:
  datasource:
    url: jdbc:h2:mem:reconciliation;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
    defer-datasource-initialization: true
  flyway:
    enabled: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
  h2:
    console:
      enabled: true
      settings:
        web-allow-others: false
